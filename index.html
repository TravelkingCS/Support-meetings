<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PONDĚLNÍ PORADA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;500;600;700&display=swap');

:root{
  --navy-deep:#0a1a3d;
  --navy:#132a5e;
  --blue-bright:#2f6fe0;
  --cyan:#5ad8ff;
  --gold:#ffcc33;
  --gold-deep:#ff8a1e;
  --magenta:#ff3d7f;
  --white:#f4f7ff;
}

*{ box-sizing:border-box; }
html,body{
  margin:0; padding:0; height:100%; width:100%;
  background:#000;
  overflow:hidden;
  font-family:'Chakra Petch', sans-serif;
  color:var(--white);
}

/* ---------- STAGE ---------- */
.stage{
  position:relative; width:100vw; height:100vh;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(47,111,224,0.18), transparent 60%),
    repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 40px),
    linear-gradient(160deg, var(--navy-deep) 0%, #060d22 55%, #030712 100%);
  cursor:pointer;
}

/* CRT scanlines, subtle */
.scanlines{
  position:absolute; inset:0; pointer-events:none; z-index:5;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply; opacity:0.5;
}
.vignette{
  position:absolute; inset:0; pointer-events:none; z-index:5;
  box-shadow:inset 0 0 18vw rgba(0,0,0,0.85);
}

/* ---------- COIN GATE (first tap) ---------- */
.coin-gate{
  position:absolute; inset:0; z-index:20;
  display:flex; align-items:center; justify-content:center;
  background:#000;
  transition:opacity .6s ease;
}
.coin-gate.hidden{ opacity:0; pointer-events:none; }
.coin-gate .prompt{
  font-family:'Press Start 2P', monospace;
  font-size:clamp(11px,2.4vw,16px);
  color:var(--gold);
  letter-spacing:2px;
  text-shadow:0 0 14px rgba(255,204,51,0.6);
  animation:blinkHard 1.1s steps(1) infinite;
  text-align:center;
}
.coin-gate .prompt small{
  display:block; margin-top:14px; font-size:.55em; color:var(--cyan); letter-spacing:1.5px;
}
@keyframes blinkHard{ 50%{ opacity:0.15; } }

/* ---------- MAIN CONTENT ---------- */
.content{
  position:relative; z-index:2;
  display:flex; flex-direction:column; align-items:center;
  opacity:0; transform:scale(0.94);
  text-align:center; padding:0 18px;
}
.content.reveal{
  animation:contentIn 1.1s cubic-bezier(.2,.9,.25,1) forwards;
}
@keyframes contentIn{
  0%{ opacity:0; transform:scale(0.9); filter:blur(6px); }
  60%{ opacity:1; filter:blur(0); }
  100%{ opacity:1; transform:scale(1); }
}

.eyebrow{
  font-family:'Press Start 2P', monospace;
  font-size:clamp(9px,1.6vw,12px);
  color:var(--cyan);
  letter-spacing:4px;
  margin-bottom:22px;
  opacity:0;
}
.content.reveal .eyebrow{ animation:fadeUp .7s ease .35s forwards; }

/* ---------- LOGO LOCKUP ---------- */
.logo-wrap{ position:relative; line-height:0.9; }
.logo-line{
  display:block;
  font-family:'Press Start 2P', monospace;
  font-weight:400;
  font-size:clamp(30px,9vw,84px);
  letter-spacing:2px;
  margin:0;
  transform:skewX(-6deg);
  background:linear-gradient(180deg, #fff2c4 0%, var(--gold) 30%, var(--gold-deep) 60%, #c23d00 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 3px 0 #7a1f00) drop-shadow(0 8px 18px rgba(255,138,30,0.45));
  opacity:0;
}
.logo-line.two{ font-size:clamp(20px,6vw,54px); margin-top:.28em; }
.content.reveal .logo-line.one{ animation:slamIn .6s cubic-bezier(.2,.8,.2,1) .1s forwards; }
.content.reveal .logo-line.two{ animation:slamIn .6s cubic-bezier(.2,.8,.2,1) .32s forwards; }
@keyframes slamIn{
  0%{ opacity:0; transform:skewX(-6deg) translateY(-26px) scale(1.3); }
  70%{ opacity:1; }
  100%{ opacity:1; transform:skewX(-6deg) translateY(0) scale(1); }
}

.tagline{
  font-family:'Press Start 2P', monospace;
  font-size:clamp(10px,2vw,15px);
  letter-spacing:2px;
  color:var(--white);
  text-shadow:2px 2px 0 var(--blue-bright), 0 0 18px rgba(90,216,255,0.5);
  margin-top:22px;
  opacity:0;
}
.content.reveal .tagline{ animation:fadeUp .7s ease .62s forwards; }

.divider{
  width:min(70vw,420px); height:2px; margin:26px 0;
  background:linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity:0;
}
.content.reveal .divider{ animation:fadeUp .7s ease .78s forwards; }

.insert-coin{
  font-family:'Press Start 2P', monospace;
  font-size:clamp(10px,1.8vw,13px);
  color:var(--gold-deep);
  letter-spacing:1.5px;
  text-shadow:2px 2px 0 rgba(0,0,0,0.6);
  opacity:0;
}
.content.reveal .insert-coin{
  animation:fadeUp .5s ease .95s forwards, blinkHard 1s steps(1) 1.6s infinite;
}

.start-btn{
  margin-top:30px;
  font-family:'Press Start 2P', monospace;
  font-size:clamp(12px,2vw,16px);
  letter-spacing:1.5px;
  color:#1a1200;
  background:linear-gradient(180deg, #ffe9a8, var(--gold) 55%, var(--gold-deep));
  border:3px solid #7a3d00;
  border-radius:6px;
  padding:16px 34px;
  cursor:pointer;
  box-shadow:0 6px 0 #7a3d00, 0 10px 24px rgba(255,138,30,0.35);
  opacity:0;
  transition:transform .12s ease, box-shadow .12s ease;
}
.content.reveal .start-btn{ animation:fadeUp .6s ease 1.1s forwards; }
.start-btn:hover, .start-btn:focus-visible{
  transform:translateY(-2px);
  box-shadow:0 8px 0 #7a3d00, 0 14px 28px rgba(255,138,30,0.45);
  outline:none;
}
.start-btn:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #7a3d00, 0 4px 10px rgba(255,138,30,0.35);
}

.footer-note{
  position:absolute; bottom:22px; left:0; right:0; z-index:2;
  text-align:center;
  font-size:11px; letter-spacing:2px; color:#5f7ab8;
  opacity:0;
}
.content.reveal ~ .footer-note{ animation:fadeUp .7s ease 1.3s forwards; }

@keyframes fadeUp{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="content" id="content">
    <div class="eyebrow">SUPPORT ARENA <span style="color:var(--gold-deep)">PŘEDSTAVUJE</span></div>
    <div class="logo-wrap">
      <span class="logo-line one">PONDĚLNÍ</span>
      <span class="logo-line two">PORADA</span>
    </div>
    <div class="tagline">The Support Warrior</div>
    <div class="divider"></div>
    <div class="insert-coin">STISKNI START</div>
    <button class="start-btn" id="startBtn" type="button">Start a new game</button>
  </div>

  <div class="footer-note">&copy; TRAVELKING SUPPORT TEAM</div>

  <div class="coin-gate" id="coinGate">
    <div class="prompt">PRESS ANYWHERE TO BEGIN
      <small>zvuk se spustí po kliknutí</small>
    </div>
  </div>
</div>
